name: "CodeQL"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_COMMIT_ID: '4eb0f7cabb9ca18132d80009312411b9261bba7b'

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 5 * * 1'  # Weekly on Mondays

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev build-essential libglfw3-dev ninja-build libomp-dev

    - name: Setup vcpkg environment
      shell: bash
      run: |
        echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV

    # The previous vcpkg setup action still targets node20, so pin and bootstrap vcpkg manually.
    - name: Checkout pinned vcpkg
      shell: bash
      run: |
        set -euxo pipefail
        git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git vcpkg
        git -C vcpkg checkout --force "$VCPKG_COMMIT_ID"
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

    - name: Bootstrap vcpkg
      run: ./bootstrap-vcpkg.sh
      working-directory: ${{ github.workspace }}/vcpkg

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: .github/codeql/codeql-config.yml

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=Release
        -DENABLE_OPENCL_TESTS=OFF
        -G Ninja
        -S ${{ github.workspace }}/gladius
      env:
        VCPKG_OVERLAY_PORTS: '${{ github.workspace }}/gladius/vcpkg-overlay-ports'

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"