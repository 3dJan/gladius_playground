openapi: 3.0.2
info:
  title: Gladius Library Extension API
  description: >
    MCP-based API for creating, validating, and managing library entries in the
    Gladius 3MF library. This contract covers the operations needed to implement
    Feature 030 (library extension).
  version: 1.0.0

paths: {}  # MCP tools are not HTTP endpoints; contracts here document tool signatures

components:
  schemas:
    LibraryEntry:
      type: object
      description: A single item in the Gladius 3MF library
      required:
        - name
        - category
        - program_snippet
        - function_id
        - description
        - tags
      properties:
        name:
          type: string
          pattern: '^[a-z0-9_]+$'
          description: Entry name in lower_snake_case, unique within category
        category:
          type: string
          enum:
            - primitives
            - csg
            - modifiers
            - operations
            - mechanical
            - lattices
            - textures
          description: Library subdirectory / category
        program_snippet:
          type: string
          description: >
            Full GLSL-like program listing in set_program_snippet format.
            Must include the library function AND a main root function that
            demonstrates it. Example:
            ```
            // Function: my_shape (ID: 1)
            float my_shape_1(vec3 pos, float radius) {
              return length(pos) - radius;
            }

            // Function: main (ID: 3) [root]
            (float shape) main_3(vec3 pos) {
              shape = my_shape_1(pos, 10.0);
            }
            ```
        function_id:
          type: integer
          description: Resource ID of the function to tag as the library function (not main). This is the function that will be importable.
        description:
          type: string
          minLength: 10
          maxLength: 100
          description: One-sentence human-readable description
        tags:
          type: array
          items:
            type: string
          minItems: 5
          uniqueItems: true
          description: Searchable keywords for the entry
        overwrite:
          type: boolean
          default: false
          description: If true, overwrite an existing entry with the same name

    TaggedFunction:
      type: object
      description: The primary exportable function within a library entry
      properties:
        function_name:
          type: string
          pattern: '^[a-z0-9_]+$'
        return_type:
          type: string
          enum: [float, vec3]
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'

    Parameter:
      type: object
      properties:
        name:
          type: string
          pattern: '^[a-z][a-zA-Z0-9]*$'
        type:
          type: string
          enum: [float, vec3]

  examples:
    symmetry_y_entry:
      summary: SymmetryY library entry example
      value:
        name: symmetry_y
        category: operations
        program_snippet: |
          // Function: symmetryY (ID: 1)
          vec3 symmetryY(vec3 pos) {
              return vec3(-pos.x, -pos.y, pos.z);
          }

          // Function: main (ID: 2) [root]
          (float shape) main(vec3 pos) {
              float radius = 10.0;
              vec3 p = symmetryY(pos);
              shape = length(p) - radius;
          }
        function_id: 1
        description: "Point reflection across YZ plane (mirrors X and Z coordinates)"
        tags:
          - symmetry
          - mirror
          - transformation
          - reflection
          - operations
        overwrite: false

    ellipsoid_entry:
      summary: Ellipsoid primitive example
      value:
        name: ellipsoid
        category: primitives
        program_snippet: |
          // Function: ellipsoid (ID: 1)
          float ellipsoid(vec3 pos, float xRadius, float yRadius, float zRadius) {
              return length(pos / vec3(xRadius, yRadius, zRadius)) - 1.0;
          }

          // Function: main (ID: 2) [root]
          (float shape) main(vec3 pos) {
              shape = ellipsoid(pos, 8.0, 5.0, 3.0);
          }
        function_id: 1
        description: "Ellipsoid primitive with three independent radii along each axis"
        tags:
          - ellipsoid
          - primitive
          - sphere
          - radius
          - geometry
        overwrite: false

    twist_entry:
      summary: Twist modifier example
      value:
        name: twist
        category: modifiers
        program_snippet: |
          // Function: twist (ID: 1)
          vec3 twist(vec3 pos, float angle) {
              if (angle == 0.0) return pos;
              float t = pos.z / 10.0;
              float c = cos(angle * t);
              float s = sin(angle * t);
              vec2 rotated = vec2(pos.x * c - pos.y * s, pos.x * s + pos.y * c);
              return vec3(rotated.x, rotated.y, pos.z);
          }

          // Function: main (ID: 2) [root]
          (float shape) main(vec3 pos) {
              float radius = 5.0;
              vec3 twisted = twist(pos, 45.0);
              shape = length(twisted.xy) - radius;
          }
        function_id: 1
        description: "Applies rotational twist around Z axis proportional to height"
        tags:
          - twist
          - deformation
          - modifier
          - rotation
          - transformation
        overwrite: false

    hex_nut_entry:
      summary: Hex nut mechanical part example
      value:
        name: hex_nut
        category: mechanical
        program_snippet: |
          // Function: hex_nut (ID: 1)
          float hex_nut(vec3 pos, float size) {
              vec2 p = abs(pos.xy);
              float angle = 2.0 * 3.14159 / 6.0;
              float outerHex = max(
                  dot(p, vec2(sin(angle), cos(angle))),
                  -pos.z + size * 0.5,
                  pos.z + size * 0.5
              ) - size * 0.577;
              float innerHole = length(pos.xy) - size * 0.3;
              return max(outerHex, innerHole);
          }

          // Function: main (ID: 2) [root]
          (float shape) main(vec3 pos) {
              shape = hex_nut(pos, 10.0);
          }
        function_id: 1
        description: "Hexagonal nut with threaded hole for M6 metric fastener"
        tags:
          - hex_nut
          - mechanical
          - fastener
          - hardware
          - metric
        overwrite: false
